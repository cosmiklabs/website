  </g>
  <g fill="#A7A196" font-family="monospace" font-size="13" letter-spacing="1.2">
    <text x="80" y="398">PLAYER START</text><text x="691" y="65">LIGHT</text><text x="715" y="463">SCRIPT AREA</text>
    <text x="56" y="67">STORY / FIRST ROOM</text>
