    <circle cx="551" cy="227" r="59" fill="#E0A53A" fill-opacity=".06" stroke="#E0A53A" stroke-opacity=".35"/>
    <circle cx="551" cy="227" r="9" fill="#E0A53A"/>
    <path d="M551 205v-8m0 60v-8m22-22h8m-60 0h8m6-16-6-6m38 38-6-6m0-26 6-6m-38 38 6-6" stroke="#E0A53A" stroke-width="1.5"/>
  </g>
  <g class="player-route" stroke="#ECE7DD" stroke-width="2">
