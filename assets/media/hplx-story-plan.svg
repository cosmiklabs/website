  <rect width="920" height="560" fill="#0E0F11"/>
  <rect x="32" y="32" width="856" height="496" fill="url(#plan-grid)"/>
  <g class="room" stroke="#A7A196" stroke-width="3">
    <path d="M245 124H696V424H245V310M245 242V124"/>
    <path d="M256 135H685V413H256V310M256 242V135" stroke-width="1"/>
    <path d="M245 242h-68v68" stroke-width="2"/>
    <path d="M177 242a68 68 0 0 1 68 68" stroke-width="1" stroke-dasharray="4 6"/>
    <path d="M685 216h-74v116h74M611 254h74M611 294h74" stroke-width="1.5"/>
    <path d="M327 135v34h150v-34M374 135v34M426 135v34" stroke-width="1.5"/>
  </g>
  <g class="script-area">
    <rect x="344" y="284" width="138" height="98" fill="#E0A53A" fill-opacity=".07" stroke="#E0A53A" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="m396 316-12 12 12 12m33-24 12 12-12 12m-12-28-11 32" stroke="#E0A53A" stroke-width="1.5"/>
  </g>
  <g class="story-light">
