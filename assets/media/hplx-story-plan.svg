<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" fill="none" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">An illustrative custom-story room</title>
  <desc id="plan-desc">A top-down schematic connects a player start, a doorway, a light and a script area. These are a workflow illustration, not a screenshot or game assets.</desc>
